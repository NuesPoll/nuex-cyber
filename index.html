<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NUEX — Raw Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000;color:#9FE870;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.65}
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-thumb{background:#1F3A15;border-radius:3px}
  body{padding:20px;max-width:900px;margin:0 auto}
  .dim{color:#4D7A34}
  .white{color:#E6F5DC}
  .amber{color:#E0C25A}
  .red{color:#E06A5A}
  .cursor{display:inline-block;width:7px;height:14px;background:#9FE870;animation:blink 1s steps(1) infinite;vertical-align:-2px}
  @keyframes blink{50%{opacity:0}}
  input{background:transparent;border:none;outline:none;color:#E6F5DC;font-family:inherit;font-size:inherit;width:260px}
  button{background:transparent;border:none;color:#9FE870;font-family:inherit;font-size:inherit;cursor:pointer;text-decoration:underline}
  button:disabled{color:#4D7A34;cursor:default;text-decoration:none}
  .row{white-space:pre-wrap;word-break:break-all}
  @media print{body{color:#000;background:#fff}}
</style>
</head>
<body>

<div class="dim">nuex cyber defense engine — raw terminal mode</div>
<div class="dim">type a domain and press enter, or click RUN</div>
<div>&nbsp;</div>

<div class="row">$ target <input id="target-domain" value="solana.com" /> <button onclick="executeAudit()" id="scan-btn">[RUN]</button> <button onclick="exportJSON()">[EXPORT JSON]</button> <button onclick="exportPDF()">[PRINT]</button></div>
<div>&nbsp;</div>

<div id="output"></div>
<div id="soc-logs" class="dim" style="margin-top:12px"></div>

<div class="row">$ <span class="cursor"></span></div>

<div class="hidden print:block" id="print-meta" style="display:none">
  <span id="print-domain"></span><span id="print-date"></span>
</div>

<script>
function showToast(msg){appendLog('> '+msg);}
function copyToClipboard(text){navigator.clipboard.writeText(text).then(()=>showToast(`copied: ${text}`));}
function appendLog(msg,type='info'){const logs=document.getElementById('soc-logs');const e=document.createElement('div');let cls='dim';if(type==='success')cls='';if(type==='action')cls='white';if(type==='warn')cls='amber';if(type==='error')cls='red';e.className='row '+cls;e.innerText=`[${new Date().toLocaleTimeString()}] ${msg}`;logs.prepend(e);}
function sanitizeDomain(raw){let d=raw.trim().toLowerCase();d=d.replace(/^https?:\/\//,'');d=d.split('/')[0];d=d.split(':')[0];d=d.replace(/^www\./,'');return d;}
async function dohQuery(name,type){const url=`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(name)}&type=${type}`;const res=await fetch(url,{headers:{'Accept':'application/dns-json'}});return res.json();}
async function fetchSubdomains(domain){try{const res=await fetch(`https://crt.sh/?q=%25.${encodeURIComponent(domain)}&output=json`);if(!res.ok)return{ok:false,reason:`crt.sh HTTP ${res.status}`};const data=await res.json();const subs=[...new Set(data.map(i=>i.name_value.toLowerCase()).flatMap(v=>v.split('\n')))];return{ok:true,subdomains:subs.slice(0,20)};}catch(e){return{ok:false,reason:'crt.sh unreachable (network/CORS/rate-limit)'};}}
async function checkHttpsAndHeaders(domain){const r={reachable:null,hsts:'unknown',csp:'unknown'};try{const res=await fetch(`https://${domain}`,{method:'GET',mode:'cors',redirect:'follow'});r.reachable=true;r.hsts=res.headers.get('strict-transport-security')?'present':'unreadable';r.csp=res.headers.get('content-security-policy')?'present':'unreadable';}catch(e){r.reachable='unverifiable';}return r;}

let currentDnsRecords=[];

async function executeAudit(){
  const domain=sanitizeDomain(document.getElementById('target-domain').value);
  const btn=document.getElementById('scan-btn');
  const out=document.getElementById('output');
  if(!domain){showToast('enter a valid domain');return;}
  document.getElementById('target-domain').value=domain;
  btn.disabled=true;btn.innerText='[RUNNING...]';
  out.innerHTML='';
  appendLog(`initiating scan: ${domain}`,'action');
  document.getElementById('print-domain').innerText=domain;
  document.getElementById('print-date').innerText=new Date().toLocaleString();

  function line(html,cls=''){const d=document.createElement('div');d.className='row '+cls;d.innerHTML=html;out.appendChild(d);}

  try{
    line(`&gt; resolving DNS for <span class="white">${domain}</span>...`);
    const [aRes,aaaaRes,mxRes,txtRes,dmarcRes]=await Promise.all([dohQuery(domain,'A'),dohQuery(domain,'AAAA'),dohQuery(domain,'MX'),dohQuery(domain,'TXT'),dohQuery(`_dmarc.${domain}`,'TXT')]);
    currentDnsRecords=[];
    (aRes.Answer||[]).filter(a=>a.type===1).forEach(a=>currentDnsRecords.push({type:'A',value:a.data,ttl:a.TTL}));
    (aaaaRes.Answer||[]).filter(a=>a.type===28).forEach(a=>currentDnsRecords.push({type:'AAAA',value:a.data,ttl:a.TTL}));
    (mxRes.Answer||[]).filter(a=>a.type===15).forEach(a=>currentDnsRecords.push({type:'MX',value:a.data,ttl:a.TTL}));
    (txtRes.Answer||[]).filter(a=>a.type===16).forEach(a=>currentDnsRecords.push({type:'TXT',value:a.data.replace(/^"|"$/g,''),ttl:a.TTL}));
    line(`&gt; ${currentDnsRecords.length} records found`,'dim');
    currentDnsRecords.forEach(r=>line(`&nbsp;&nbsp;${r.type.padEnd(6)} ${r.value}  <span class="dim">ttl=${r.ttl}s</span>`));

    const spfRecord=currentDnsRecords.find(r=>r.type==='TXT'&&r.value.includes('spf1'));
    const dmarcRecord=(dmarcRes.Answer||[]).find(a=>a.data&&a.data.includes('DMARC1'));
    line('&nbsp;');
    line(`&gt; spf: <span class="${spfRecord?'':'red'}">${spfRecord?'pass':'FAIL — no spf1 record'}</span>`);
    line(`&gt; dmarc: <span class="${dmarcRecord?'':'red'}">${dmarcRecord?'pass':'FAIL — no _dmarc record'}</span>`);

    line('&nbsp;');
    line(`&gt; querying crt.sh for subdomains...`);
    appendLog('querying crt.sh','action');
    const subResult=await fetchSubdomains(domain);
    if(subResult.ok){
      line(`&gt; ${subResult.subdomains.length} subdomains found`,'dim');
      subResult.subdomains.forEach(s=>line(`&nbsp;&nbsp;${s}`));
      appendLog(`${subResult.subdomains.length} subdomains found`,'success');
    }else{
      line(`&gt; <span class="amber">subdomain discovery unavailable — ${subResult.reason}</span>`);
      line(`&nbsp;&nbsp;<span class="dim">no guessed data shown — nuex does not fabricate results</span>`);
      appendLog(`subdomain discovery failed: ${subResult.reason}`,'warn');
    }

    line('&nbsp;');
    line(`&gt; checking https transport...`);
    const h=await checkHttpsAndHeaders(domain);
    line(`&gt; https reachable: <span class="${h.reachable===true?'':'amber'}">${h.reachable===true?'yes':'unable to verify (browser CORS restriction)'}</span>`);
    line(`&gt; hsts header: <span class="${h.hsts==='present'?'':'amber'}">${h.hsts==='present'?'present':'unable to verify'}</span>`);
    line(`&gt; csp header: <span class="${h.csp==='present'?'':'amber'}">${h.csp==='present'?'present':'unable to verify'}</span>`);

    let score=40;
    if(currentDnsRecords.some(r=>r.type==='A'))score+=20;
    if(currentDnsRecords.some(r=>r.type==='MX'))score+=15;
    if(spfRecord)score+=12;
    if(dmarcRecord)score+=13;
    const grade=score>=80?'LOW RISK':score>=60?'MODERATE RISK':'HIGH RISK';

    line('&nbsp;');
    line(`&gt; <span class="white">score: ${score}/100 — ${grade}</span>`);

    if(!spfRecord||!dmarcRecord){
      line('&nbsp;');
      line(`&gt; remediation:`,'dim');
      if(!spfRecord)line(`&nbsp;&nbsp;add TXT: <span class="white">v=spf1 include:_spf.google.com ~all</span>  <button onclick="copyToClipboard('v=spf1 include:_spf.google.com ~all')">[copy]</button>`);
      if(!dmarcRecord)line(`&nbsp;&nbsp;add TXT _dmarc.${domain}: <span class="white">v=DMARC1; p=reject; rua=mailto:dmarc@${domain}</span>  <button onclick="copyToClipboard('v=DMARC1; p=reject; rua=mailto:dmarc@${domain}')">[copy]</button>`);
    }

    appendLog(`scan complete. score ${score}/100`,'success');
  }catch(err){
    line(`&gt; <span class="red">error: ${err.message}</span>`);
    appendLog(`error: ${err.message}`,'error');
  }finally{
    btn.disabled=false;btn.innerText='[RUN]';
  }
}

function exportJSON(){const domain=document.getElementById('target-domain').value||'nuex';const s="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify({domain,timestamp:new Date().toISOString(),dnsRecords:currentDnsRecords},null,2));const a=document.createElement('a');a.href=s;a.download=`nuex-${domain}.json`;a.click();showToast('exported JSON');}
function exportPDF(){window.print();}
document.getElementById('target-domain').addEventListener('keydown',e=>{if(e.key==='Enter')executeAudit();});
</script>
</body>
</html>
